<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251c">
  <title>BlockTogether | Voxel Home</title>
  <link rel="stylesheet" href="./playerHome.css">
</head>
<body>
  <main id="game" aria-label="BlockTogether voxel world">
    <div class="game-help">
      <strong>BlockTogether</strong>
      Click the world to play. Move with WASD and look with the mouse.
      <br>Space: jump &middot; Left click: break &middot; Right click: place selected block
      <br>1&ndash;9, 0: select block &middot; Tab: switch color set &middot; Set 2, 0: glass
      <br>Aim at a block within 6 blocks. Esc: release mouse.
    </div>
    <div class="crosshair" aria-hidden="true">+</div>
  </main>
  <script type="module" src="./playerHome.js"></script>
</body>
</html>
