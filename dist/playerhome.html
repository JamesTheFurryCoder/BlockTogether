<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251c">
  <title>BlockTogether | Voxel Home</title>
  <style>
    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #17251c;
      font: 14px/1.5 "Segoe UI", sans-serif;
    }

    #game {
      position: relative;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .game-help {
      position: fixed;
      z-index: 1;
      top: 16px;
      left: 16px;
      padding: 10px 14px;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: 8px;
      background: rgb(23 37 28 / 85%);
      color: #fff;
      pointer-events: none;
    }

    .game-help strong {
      display: block;
      margin-bottom: 2px;
    }

    .crosshair {
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font: 24px/1 monospace;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
  </style>
  <script type="module" crossorigin src="/assets/playerhome-BCZ-SS_x.js"></script>
</head>
<body>
  <main id="game" aria-label="BlockTogether voxel world">
    <div class="game-help">
      <strong>BlockTogether</strong>
      Click the world to play. Move with WASD and look with the mouse.
      <br>Space: jump &middot; Left click: break &middot; Right click: place grass
      <br>Aim at a block within 6 blocks. Esc: release mouse.
    </div>
    <div class="crosshair" aria-hidden="true">+</div>
  </main>
</body>
</html>
